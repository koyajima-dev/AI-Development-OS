name: Instruction Gate Tests
on:
  push:
    paths:
      - 'scripts/instruction_gate.py'
      - 'tests/test_instruction_gate.py'
      - '.github/workflows/instruction-gate.yml'
  pull_request:
    paths:
      - 'scripts/instruction_gate.py'
      - 'tests/test_instruction_gate.py'
      - '.github/workflows/instruction-gate.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_instruction_gate.py' -v
