name: Instruction Gate
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate unit tests
        run: python -m unittest discover -s tests -p 'test_instruction_gate.py' -v
      - name: Validate every tracked implementation instruction
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d instructions ]; then
            echo "No instructions directory; gate unit tests only"
            exit 0
          fi
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "Validating $file"
            python3 scripts/instruction_gate.py "$file"
          done < <(find instructions -type f -name '*.md' -print0)
          echo "Validation finished (found=$found)"
